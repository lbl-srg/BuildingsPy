[build-system]
requires = ["setuptools==70.0.0", "wheel==0.38.1"]
build-backend = "setuptools.build_meta"

[project]
name = "buildingspy"
dynamic = ["version"]
authors = [
    {name = "Michael Wetter", email = "mwetter@lbl.gov"},
]
description = "Package for simulating and testing models from the Modelica Buildings and IBPSA libraries"
readme = "README.rst"
license = {text = "3-clause BSD"}
keywords = ["modelica", "dymola", "openmodelica", "mat"]
requires-python = ">=3.8"
dependencies = [
    "Jinja2==3.1.6",
    "gitpython==3.1.43; python_version < '3.9'",
    "gitpython==3.2.1; python_version >= '3.9'",
    "matplotlib==3.7.5; python_version == '3.8'",
    "matplotlib==3.9.4; python_version == '3.9'",
    "matplotlib==3.10.7; python_version >= '3.10'",
    "numpy==1.24.4; python_version == '3.8'",
    "numpy==1.26.4; python_version >= '3.9' and python_version < '3.11'",
    "numpy==2.3.4; python_version >= '3.11'",
    "scipy==1.10.1; python_version == '3.8'",
    "scipy==1.13.1; python_version == '3.9'",
    "scipy==1.14.1; python_version == '3.10'",
    "scipy==1.16.3; python_version >= '3.11'",
    "pytidylib==0.3.2",
    "pyfunnel==2.1.1",
    "PyYAML==6.0.1",
    "cerberus==1.3.8",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = [
    "autopep8==2.3.2",
    "build==1.2.2.post1; python_version < '3.9'",
    "build==1.6.1; python_version >= '3.9'",
    "twine==5.1.1; python_version < '3.9'",
    "twine==6.1.0; python_version >= '3.9'",
]

[project.urls]
Homepage = "http://simulationresearch.lbl.gov/modelica/"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
namespaces = true
exclude = ["*.__pycache__"]

[tool.setuptools.package-data]
"buildingspy" = ["templates/**/*"]
"buildingspy.tests" = ["MyModelicaLibrary/**/*"]
"buildingspy.thirdParty.dymat" = ["doc/**/*", "scripts/**/*"]

[tool.setuptools.exclude-package-data]
"buildingspy.thirdParty" = ["__pycache__/*"]
"buildingspy.thirdParty.dymat" = ["__pycache__/*"]
"buildingspy.thirdParty.dymat.DyMat" = ["__pycache__/*"]

[tool.setuptools.dynamic]
version = {file = "buildingspy/VERSION"}
