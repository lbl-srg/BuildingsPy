[build-system]
requires = ["setuptools>=70.0.0", "wheel>=0.37.0"]
build-backend = "setuptools.build_meta"

[project]
name = "buildingspy"
dynamic = ["version"]
authors = [
    {name = "Michael Wetter", email = "mwetter@lbl.gov"},
]
description = "Package for simulating and testing models from the Modelica Buildings and IBPSA libraries"
readme = "README.rst"
license = {text = "3-clause BSD"}
keywords = ["modelica", "dymola", "openmodelica", "mat"]
requires-python = ">=3.8"
dependencies = [
    "gitpython>=3.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.10",
    "numpy>=2.3",
    "scipy>=1.16",
    "pytidylib>=0.3.2",
    "pyfunnel==2.0.2",
    "PyYAML>=6.0.1",
    "cerberus>=1.3.8",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.8",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "http://simulationresearch.lbl.gov/modelica/"

[tool.setuptools]
include-package-data = true
packages = [
    "buildingspy",
    "buildingspy.development",
    "buildingspy.examples",
    "buildingspy.fmi",
    "buildingspy.io",
    "buildingspy.simulate",
    "buildingspy.thirdParty",
    "buildingspy.thirdParty.dymat",
    "buildingspy.thirdParty.dymat.DyMat",
    "buildingspy.thirdParty.dymat.DyMat.Export",
]

[tool.setuptools.dynamic]
version = {file = "buildingspy/VERSION"}
